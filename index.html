<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Whack-a-Broccoli 🥦</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: system-ui, sans-serif;
      overflow: hidden;
      cursor: crosshair;
    }

    /* Kitchen-table background */
    body {
      background-color: #8b5a2b;
      background-image:
        repeating-linear-gradient(
          90deg,
          rgba(0,0,0,0.08) 0px,
          rgba(0,0,0,0.08) 2px,
          transparent 2px,
          transparent 12px
        ),
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,0.04) 0px,
          rgba(255,255,255,0.04) 1px,
          transparent 1px,
          transparent 40px
        );
      display: flex;
      align-items: center;
      justify-content: center;
    }

    h1 {
      position: absolute;
      top: 16px;
      width: 100%;
      text-align: center;
      color: #fff8e7;
      text-shadow: 2px 2px 0 #4a2c12;
      font-size: 38px;
      margin: 0;
      letter-spacing: 2px;
    }

    /* HUD: two pills side-by-side (score + time) */
    #hud {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 14px;
    }

    .pill {
      background: #fff8e7;
      color: #4a2c12;
      font-size: 26px;
      font-weight: bold;
      padding: 8px 24px;
      border-radius: 999px;
      box-shadow: 0 4px 0 #4a2c12;
      letter-spacing: 1px;
    }

    /* Last 5 seconds: pulse the time pill red so kids feel the pressure */
    .pill.urgent {
      background: #ffd4d4;
      color: #b00020;
      animation: pulse 0.5s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to   { transform: scale(1.08); }
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 160px);
      grid-template-rows: repeat(3, 160px);
      gap: 30px;
    }

    .hole {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 35%, #2b1707 0%, #1a0d04 70%, #000 100%);
      box-shadow:
        inset 0 -10px 20px rgba(0,0,0,0.6),
        inset 0 10px 15px rgba(255,255,255,0.05),
        0 6px 0 rgba(0,0,0,0.4);
      position: relative;
      /* overflow visible so floating +1 can escape upward */
      overflow: visible;
    }

    /* A clipping mask: only the inside-the-hole part of the creature is hidden */
    .hole::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
    }

    /* The thing that pops out of a hole (broccoli on a fork, for now) */
    .creature {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateY(100%);
      transition: transform 0.18s ease-out;
      user-select: none;
      cursor: pointer;
    }

    .creature.up {
      transform: translateY(-10%);
    }

    .creature .head {
      font-size: 80px;
      line-height: 1;
      pointer-events: none;
    }

    .creature .stick {
      font-size: 50px;
      line-height: 1;
      margin-top: -15px;
      transform: rotate(180deg);
      pointer-events: none;
    }

    /* Floating +1 / -1 that rises out of the hole when something is whacked */
    .score-pop {
      position: absolute;
      left: 50%;
      top: -10px;
      transform: translateX(-50%);
      font-size: 44px;
      font-weight: 900;
      color: #ffd84d;
      text-shadow:
        2px 2px 0 #4a2c12,
        -2px -2px 0 #4a2c12,
        2px -2px 0 #4a2c12,
        -2px 2px 0 #4a2c12;
      pointer-events: none;
      animation: floatUp 800ms ease-out forwards;
    }

    /* Red variant when you whack a candy (penalty) */
    .score-pop.minus {
      color: #ff5151;
    }

    @keyframes floatUp {
      from {
        transform: translate(-50%, 0) scale(0.6);
        opacity: 0;
      }
      20% {
        transform: translate(-50%, -10px) scale(1.2);
        opacity: 1;
      }
      to {
        transform: translate(-50%, -120px) scale(1);
        opacity: 0;
      }
    }

    /* Bomb explosion that briefly fills the hole when you whack a candy */
    .boom {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 110px;
      pointer-events: none;
      animation: boomPop 500ms ease-out forwards;
    }

    @keyframes boomPop {
      from { transform: scale(0.2); opacity: 0; }
      30%  { transform: scale(1.3); opacity: 1; }
      to   { transform: scale(1.6); opacity: 0; }
    }

    /* Cartoon hand slamming down onto the hole when you whack */
    .hand-slam {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 120px;
      pointer-events: none;
      z-index: 5;
      animation: handSlam 320ms ease-out forwards;
    }

    @keyframes handSlam {
      from { transform: translateY(-120px) rotate(-15deg) scale(1.8); opacity: 0; }
      40%  { transform: translateY(0) rotate(0deg) scale(1.4); opacity: 1; }
      75%  { transform: translateY(-8px) rotate(0deg) scale(1.3); opacity: 0.9; }
      to   { transform: translateY(0) rotate(0deg) scale(1.2); opacity: 0; }
    }

    /* "YUCK!" or "YUM...NO!" reaction text */
    .text-pop {
      position: absolute;
      left: 50%;
      top: -60px;
      transform: translateX(-50%);
      font-size: 34px;
      font-weight: 900;
      font-style: italic;
      pointer-events: none;
      white-space: nowrap;
      letter-spacing: 1px;
      text-shadow:
        2px 2px 0 #4a2c12,
        -2px -2px 0 #4a2c12,
        2px -2px 0 #4a2c12,
        -2px 2px 0 #4a2c12;
      animation: textPop 750ms ease-out forwards;
    }

    .text-pop.yuck { color: #7be05a; }
    .text-pop.yum  { color: #ff7a7a; }

    @keyframes textPop {
      from  { transform: translate(-50%, 30px) scale(0.4) rotate(-12deg); opacity: 0; }
      25%   { transform: translate(-50%, -5px) scale(1.25) rotate(6deg);  opacity: 1; }
      to    { transform: translate(-50%, -50px) scale(1) rotate(-4deg);   opacity: 0; }
    }

    /* GAME OVER overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .overlay.show {
      display: flex;
      animation: overlayIn 200ms ease-out;
    }

    @keyframes overlayIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .overlay-card {
      background: #fff8e7;
      color: #4a2c12;
      padding: 36px 60px 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 0 #4a2c12;
      animation: cardIn 300ms cubic-bezier(.2,1.4,.6,1.1);
    }

    @keyframes cardIn {
      from { transform: scale(0.6); }
      to   { transform: scale(1); }
    }

    .overlay-card h2 {
      font-size: 56px;
      margin: 0 0 16px;
      letter-spacing: 3px;
    }

    .overlay-card .label {
      font-size: 18px;
      margin: 0;
      letter-spacing: 2px;
      color: #7a5230;
    }

    .overlay-card .final-score {
      font-size: 90px;
      font-weight: 900;
      line-height: 1;
      margin: 6px 0 24px;
      color: #d4691f;
    }

    .overlay-card button {
      font-size: 24px;
      font-weight: 900;
      background: #ff9836;
      color: #fff;
      border: none;
      padding: 14px 32px;
      border-radius: 999px;
      box-shadow: 0 5px 0 #b85e1a;
      cursor: pointer;
      letter-spacing: 2px;
      transition: transform 0.08s, box-shadow 0.08s;
      font-family: inherit;
    }
    .overlay-card button:hover { transform: translateY(-1px); }
    .overlay-card button:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #b85e1a;
    }
  </style>
</head>
<body>
  <h1>WHACK-A-BROCCOLI</h1>
  <div id="hud">
    <div class="pill">SCORE: <span id="score">0</span></div>
    <div class="pill" id="timePill">TIME: <span id="time">30</span></div>
  </div>

  <div class="grid" id="grid">
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
  </div>

  <div class="overlay" id="overlay">
    <div class="overlay-card">
      <h2>GAME OVER</h2>
      <p class="label">FINAL SCORE</p>
      <div class="final-score" id="finalScore">0</div>
      <button id="playAgain">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    const POP_EVERY_MS = 900;
    const STAY_UP_MS  = 1100;
    const CANDY_CHANCE = 0.25;     // ~1 in 4 pops is candy — don't whack it!
    const GAME_LENGTH_SEC = 30;    // round length

    const holes = document.querySelectorAll('.hole');
    const scoreEl = document.getElementById('score');
    const timeEl  = document.getElementById('time');
    const timePill = document.getElementById('timePill');
    const overlay = document.getElementById('overlay');
    const finalScoreEl = document.getElementById('finalScore');
    const playAgainBtn = document.getElementById('playAgain');

    let score = 0;
    let timeLeft = GAME_LENGTH_SEC;
    let gameOver = false;
    let spawnTimer = null;
    let countdownTimer = null;

    // Keyboard mapping: each key whacks the hole at the same spot on the grid.
    //   Q W E
    //   A S D
    //   Z X C
    const KEY_TO_HOLE = {
      q: 0, w: 1, e: 2,
      a: 3, s: 4, d: 5,
      z: 6, x: 7, c: 8,
    };

    function bumpScore(by) {
      score += by;
      scoreEl.textContent = score;
    }

    function floatScorePop(hole, text, isMinus) {
      const pop = document.createElement('div');
      pop.className = 'score-pop' + (isMinus ? ' minus' : '');
      pop.textContent = text;
      hole.appendChild(pop);
      setTimeout(() => pop.remove(), 800);
    }

    function boom(hole) {
      const b = document.createElement('div');
      b.className = 'boom';
      b.textContent = '💥';
      hole.appendChild(b);
      setTimeout(() => b.remove(), 500);
    }

    function handSlam(hole) {
      const h = document.createElement('div');
      h.className = 'hand-slam';
      h.textContent = '✋';
      hole.appendChild(h);
      setTimeout(() => h.remove(), 320);
    }

    function textPop(hole, text, kind) {
      const t = document.createElement('div');
      t.className = 'text-pop ' + kind;
      t.textContent = text;
      hole.appendChild(t);
      setTimeout(() => t.remove(), 750);
    }

    // --- Splat sound, synthesized on the fly (no audio files) ---
    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        audioCtx = new AC();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playSplat(isCandy) {
      const ctx = getAudio();
      if (!ctx) return;
      const now = ctx.currentTime;

      // Noise burst — the splat texture
      const dur = 0.18;
      const bufSize = Math.floor(ctx.sampleRate * dur);
      const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buf;

      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(isCandy ? 700 : 1600, now);
      filter.frequency.exponentialRampToValueAtTime(120, now + dur);

      const noiseGain = ctx.createGain();
      noiseGain.gain.setValueAtTime(0.55, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, now + dur);

      noise.connect(filter); filter.connect(noiseGain); noiseGain.connect(ctx.destination);
      noise.start(now);
      noise.stop(now + dur);

      // Low thud underneath
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(isCandy ? 220 : 130, now);
      osc.frequency.exponentialRampToValueAtTime(40, now + 0.12);

      const oscGain = ctx.createGain();
      oscGain.gain.setValueAtTime(0.45, now);
      oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

      osc.connect(oscGain); oscGain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.12);
    }

    function removeCreature(hole, creature) {
      // Guard against double-removal (auto-hide + click can race).
      if (creature._gone) return;
      creature._gone = true;
      if (creature._hideTimer) clearTimeout(creature._hideTimer);
      creature.classList.remove('up');
      setTimeout(() => {
        creature.remove();
        delete hole.dataset.busy;
      }, 200);
    }

    function whack(hole, creature) {
      if (gameOver) return;
      if (creature._gone) return;
      handSlam(hole);
      if (creature.dataset.kind === 'candy') {
        bumpScore(-1);
        floatScorePop(hole, '-1', true);
        textPop(hole, 'YUM...NO!', 'yum');
        boom(hole);
        playSplat(true);
      } else {
        bumpScore(1);
        floatScorePop(hole, '+1', false);
        textPop(hole, 'YUCK!', 'yuck');
        playSplat(false);
      }
      removeCreature(hole, creature);
    }

    function popRandomThing() {
      const free = [...holes].filter(h => !h.dataset.busy);
      if (free.length === 0) return;
      const hole = free[Math.floor(Math.random() * free.length)];
      hole.dataset.busy = '1';

      const isCandy = Math.random() < CANDY_CHANCE;
      const creature = document.createElement('div');
      creature.className = 'creature';
      creature.dataset.kind = isCandy ? 'candy' : 'broccoli';
      creature.innerHTML = isCandy
        ? '<span class="head">🍬</span>'
        : '<span class="head">🥦</span><span class="stick">🍴</span>';
      hole._creature = creature;

      creature.addEventListener('click', () => whack(hole, creature));

      hole.appendChild(creature);

      requestAnimationFrame(() => {
        requestAnimationFrame(() => creature.classList.add('up'));
      });

      // Auto-hide if it's not whacked in time.
      creature._hideTimer = setTimeout(() => {
        delete hole._creature;
        removeCreature(hole, creature);
      }, STAY_UP_MS);
    }

    // Keyboard: when a mapped key is pressed, whack the broccoli in that hole (if any).
    document.addEventListener('keydown', (e) => {
      if (gameOver) return;
      if (e.repeat) return;
      const idx = KEY_TO_HOLE[e.key.toLowerCase()];
      if (idx === undefined) return;
      const hole = holes[idx];
      const creature = hole._creature;
      if (!creature) return;
      delete hole._creature;
      whack(hole, creature);
    });

    function clearAllHoles() {
      holes.forEach(h => {
        if (h._creature) {
          if (h._creature._hideTimer) clearTimeout(h._creature._hideTimer);
          h._creature.remove();
          delete h._creature;
        }
        delete h.dataset.busy;
      });
    }

    function tick() {
      timeLeft -= 1;
      timeEl.textContent = timeLeft;
      if (timeLeft <= 5) timePill.classList.add('urgent');
      if (timeLeft <= 0) endGame();
    }

    function endGame() {
      gameOver = true;
      clearInterval(spawnTimer);
      clearInterval(countdownTimer);
      spawnTimer = null;
      countdownTimer = null;
      finalScoreEl.textContent = score;
      overlay.classList.add('show');
    }

    function startGame() {
      // Reset state
      score = 0;
      scoreEl.textContent = '0';
      timeLeft = GAME_LENGTH_SEC;
      timeEl.textContent = timeLeft;
      timePill.classList.remove('urgent');
      gameOver = false;
      overlay.classList.remove('show');
      clearAllHoles();

      // Start the two heartbeats: one spawns things, one counts down.
      spawnTimer = setInterval(popRandomThing, POP_EVERY_MS);
      countdownTimer = setInterval(tick, 1000);
    }

    playAgainBtn.addEventListener('click', startGame);

    startGame();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Whack-a-Broccoli 🥦</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }

    /* Kitchen-table background — wood grain made with CSS gradients */
    body {
      background-color: #8b5a2b;
      background-image:
        repeating-linear-gradient(
          90deg,
          rgba(0,0,0,0.08) 0px,
          rgba(0,0,0,0.08) 2px,
          transparent 2px,
          transparent 12px
        ),
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,0.04) 0px,
          rgba(255,255,255,0.04) 1px,
          transparent 1px,
          transparent 40px
        );
      display: flex;
      align-items: center;
      justify-content: center;
    }

    h1 {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      color: #fff8e7;
      text-shadow: 2px 2px 0 #4a2c12;
      font-size: 42px;
      margin: 0;
      letter-spacing: 2px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 160px);
      grid-template-rows: repeat(3, 160px);
      gap: 30px;
    }

    .hole {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 35%, #2b1707 0%, #1a0d04 70%, #000 100%);
      box-shadow:
        inset 0 -10px 20px rgba(0,0,0,0.6),
        inset 0 10px 15px rgba(255,255,255,0.05),
        0 6px 0 rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <h1>WHACK-A-BROCCOLI</h1>

  <div class="grid">
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
  </div>
</body>
</html>
